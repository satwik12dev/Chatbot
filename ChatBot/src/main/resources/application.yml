spring:
  application:
    name: ava-backend
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.ai.retry.autoconfigure.SpringAiRetryAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/ava_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DATABASE_USERNAME:ava_user}
    password: ${DATABASE_PASSWORD:ava_pass123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

  mail:
    host: ${BREVO_SMTP_HOST:smtp-relay.brevo.com}
    port: ${BREVO_SMTP_PORT:587}
    username: ${BREVO_SMTP_USERNAME:}
    password: ${BREVO_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    default-encoding: UTF-8

  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:mock-key-for-development}
        chat:
          model: ${GEMINI_CHAT_MODEL:gemini-3.7-flash}
          options:
            model: ${GEMINI_CHAT_MODEL:gemini-3.7-flash}
ava:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    access-token-expiration-ms: ${JWT_ACCESS_TOKEN_EXPIRATION:900000} # 15 minutes
    refresh-token-expiration-ms: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000} # 7 days
  gemini:
    chat-model: ${GEMINI_CHAT_MODEL:gemini-3.7-flash}
    fallback-models: ${GEMINI_FALLBACK_MODELS:gemini-3.1-flash-lite,gemini-3-flash-preview,gemini-3.5-flash,gemini-3.6-flash}
    stt-model: ${GEMINI_STT_MODEL:gemini-3.5-flash}
    tts-model: ${GEMINI_TTS_MODEL:gemini-3.5-flash}
    temperature: 0.7
    max-tokens: 4096
    timeout-ms: 30000
    max-retries: 3
  limits:
    max-message-length: ${MAX_MESSAGE_LENGTH:10000}
    max-audio-size-mb: ${MAX_AUDIO_SIZE_MB:25}
    max-context-messages: ${MAX_CONTEXT_MESSAGES:30}
    max-page-size: ${MAX_PAGE_SIZE:50}
    summary-threshold-messages: 20
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  ratelimit:
    enabled: true
    requests-per-minute: 60
    burst-capacity: 100
  mail:
    from-email: ${BREVO_FROM_EMAIL:no-reply@ava.ai}
    from-name: ${BREVO_FROM_NAME:AVA AI Assistant}

server:
  port: ${PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
